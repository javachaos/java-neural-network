[package]
name = "neuro-evolution-worker"
version = "0.1.0"
edition = "2024"

[features]
default = ["grpc", "cuda"]
grpc = ["dep:prost", "dep:tokio", "dep:tokio-stream", "dep:tonic"]
cuda = []

[dependencies]
prost = { version = "0.12", optional = true }
rayon = "1.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"], optional = true }
tokio-stream = { version = "0.1", optional = true }
tonic = { version = "0.11", optional = true }

[profile.release]
lto = "thin"
codegen-units = 1
